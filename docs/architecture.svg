<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 930" width="100%" role="img" font-family="'PingFang SC','Microsoft YaHei',system-ui,sans-serif">
  <title>ra-backend 后端架构图</title>
  <desc>ra-backend 的分层架构：客户端经 Caddy 与 FastAPI 进入 API 路由层，由服务层主链路 chat_service 编排，Agent Runtime 经 ToolProvider 调用本地或 MCP 工具，联网知识子模块负责全网抓取，外部依赖为微信/Kimi/搜索/公网，数据持久化到 SQLite。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="24" text-anchor="middle" font-size="15" font-weight="500" fill="#0F172A">ra-backend 后端架构图</text>
  <text x="340" y="42" text-anchor="middle" font-size="12" fill="#64748B">分层结构与一次聊天请求的主链路</text>

  <!-- Tier 1 Clients -->
  <rect x="110" y="48" width="550" height="58" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="122" y="83" font-size="11" font-weight="500" fill="#0C447C">客户端</text>
  <rect x="190" y="62" width="215" height="42" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="297" y="78" text-anchor="middle" font-size="11" fill="#0F172A">微信小程序</text>
  <text x="297" y="95" text-anchor="middle" font-size="11" fill="#0F172A">ra-miniapp</text>
  <rect x="420" y="62" width="215" height="42" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="527" y="78" text-anchor="middle" font-size="11" fill="#0F172A">Web 前端</text>
  <text x="527" y="95" text-anchor="middle" font-size="11" fill="#0F172A">ra-webapp</text>

  <!-- Tier 2 Gateway -->
  <rect x="110" y="120" width="550" height="52" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="122" y="153" font-size="11" font-weight="500" fill="#27500A">网关</text>
  <rect x="190" y="136" width="215" height="34" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
  <text x="297" y="155" text-anchor="middle" font-size="11" fill="#0F172A">Caddy 反代 / TLS</text>
  <rect x="420" y="136" width="215" height="34" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
  <text x="527" y="155" text-anchor="middle" font-size="11" fill="#0F172A">FastAPI :8000</text>

  <!-- Tier 3 API Routes -->
  <rect x="110" y="186" width="550" height="78" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
  <text x="122" y="225" font-size="11" font-weight="500" fill="#633806">API 路由</text>
  <rect x="190" y="200" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="263" y="216" text-anchor="middle" font-size="11" fill="#0F172A">auth</text>
  <rect x="340" y="200" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="413" y="216" text-anchor="middle" font-size="11" fill="#0F172A">me</text>
  <rect x="490" y="200" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="563" y="216" text-anchor="middle" font-size="11" fill="#0F172A">chat</text>
  <rect x="190" y="236" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="263" y="252" text-anchor="middle" font-size="11" fill="#0F172A">document</text>
  <rect x="340" y="236" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="413" y="252" text-anchor="middle" font-size="11" fill="#0F172A">search</text>
  <rect x="490" y="236" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#854F0B" stroke-width="1"/><text x="563" y="252" text-anchor="middle" font-size="11" fill="#0F172A">suggestions</text>

  <!-- Tier 4 Services -->
  <rect x="110" y="278" width="550" height="120" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
  <text x="122" y="338" font-size="11" font-weight="500" fill="#3C3489">服务层</text>
  <rect x="190" y="300" width="112" height="34" rx="8" fill="#AFA9EC" stroke="#534AB7" stroke-width="2"/>
  <text x="246" y="319" text-anchor="middle" font-size="11" font-weight="500" fill="#3C3489">chat 主链路</text>
  <rect x="306" y="300" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="362" y="319" text-anchor="middle" font-size="11" fill="#0F172A">document</text>
  <rect x="422" y="300" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="478" y="319" text-anchor="middle" font-size="11" fill="#0F172A">search</text>
  <rect x="538" y="300" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="594" y="319" text-anchor="middle" font-size="11" fill="#0F172A">web_search</text>
  <rect x="190" y="340" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="246" y="359" text-anchor="middle" font-size="11" fill="#0F172A">personal_kb</text>
  <rect x="306" y="340" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="362" y="359" text-anchor="middle" font-size="11" fill="#0F172A">storage</text>
  <rect x="422" y="340" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#534AB7" stroke-width="1"/><text x="478" y="359" text-anchor="middle" font-size="11" fill="#0F172A">taskqueue</text>

  <!-- Tier 5 Agent Runtime -->
  <rect x="110" y="412" width="550" height="56" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <text x="122" y="440" font-size="11" font-weight="500" fill="#085041">Agent 运行时</text>
  <rect x="190" y="426" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text x="246" y="445" text-anchor="middle" font-size="11" fill="#0F172A">Orchestrator</text>
  <rect x="306" y="426" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text x="362" y="445" text-anchor="middle" font-size="11" fill="#0F172A">ToolProvider</text>
  <rect x="422" y="426" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text x="478" y="445" text-anchor="middle" font-size="11" fill="#0F172A">Policy</text>
  <rect x="538" y="426" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#0F6E56" stroke-width="1"/><text x="594" y="445" text-anchor="middle" font-size="11" fill="#0F172A">Trace</text>

  <!-- Tier 6 Tools -->
  <rect x="110" y="482" width="550" height="64" rx="12" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
  <text x="122" y="514" font-size="11" font-weight="500" fill="#72243E">工具 / 能力</text>
  <rect x="190" y="492" width="215" height="42" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
  <text x="297" y="508" text-anchor="middle" font-size="11" fill="#0F172A">本地 ToolRegistry</text>
  <text x="297" y="525" text-anchor="middle" font-size="11" fill="#0F172A">(local 模式)</text>
  <rect x="420" y="492" width="215" height="42" rx="8" fill="#FFFFFF" stroke="#993556" stroke-width="1"/>
  <text x="527" y="508" text-anchor="middle" font-size="11" fill="#0F172A">MCP servers</text>
  <text x="527" y="525" text-anchor="middle" font-size="11" fill="#0F172A">knowledge·memory·utility</text>

  <!-- Tier 7 Web Knowledge -->
  <rect x="110" y="560" width="550" height="120" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
  <text x="122" y="620" font-size="11" font-weight="500" fill="#712B13">联网知识 web/</text>
  <rect x="190" y="576" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="263" y="592" text-anchor="middle" font-size="11" fill="#0F172A">search_provider</text>
  <rect x="340" y="576" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="413" y="592" text-anchor="middle" font-size="11" fill="#0F172A">fetch_http</text>
  <rect x="490" y="576" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="563" y="592" text-anchor="middle" font-size="11" fill="#0F172A">robots</text>
  <rect x="190" y="612" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="263" y="628" text-anchor="middle" font-size="11" fill="#0F172A">dedup / normalize</text>
  <rect x="340" y="612" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="413" y="628" text-anchor="middle" font-size="11" fill="#0F172A">citation / organizer</text>
  <rect x="490" y="612" width="146" height="30" rx="8" fill="#FFFFFF" stroke="#993C1D" stroke-width="1"/><text x="563" y="628" text-anchor="middle" font-size="11" fill="#0F172A">need / url_guard</text>

  <!-- Tier 8 External -->
  <rect x="110" y="694" width="550" height="56" rx="12" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="122" y="722" font-size="11" font-weight="500" fill="#444441">外部依赖</text>
  <rect x="190" y="708" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="246" y="727" text-anchor="middle" font-size="11" fill="#0F172A">微信登录</text>
  <rect x="306" y="708" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="362" y="727" text-anchor="middle" font-size="11" fill="#0F172A">Kimi LLM</text>
  <rect x="422" y="708" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="478" y="727" text-anchor="middle" font-size="11" fill="#0F172A">Tavily/Serper</text>
  <rect x="538" y="708" width="112" height="34" rx="8" fill="#FFFFFF" stroke="#5F5E5A" stroke-width="1"/><text x="594" y="727" text-anchor="middle" font-size="11" fill="#0F172A">公网网页</text>

  <!-- Tier 9 Data -->
  <rect x="110" y="764" width="550" height="64" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
  <text x="122" y="796" font-size="11" font-weight="500" fill="#0C447C">数据 / 存储</text>
  <rect x="190" y="774" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="263" y="790" text-anchor="middle" font-size="11" fill="#0F172A">SQLite</text>
  <text x="263" y="807" text-anchor="middle" font-size="11" fill="#0F172A">(SQLAlchemy)</text>
  <rect x="344" y="774" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="417" y="790" text-anchor="middle" font-size="11" fill="#0F172A">data/ 运行时</text>
  <text x="417" y="807" text-anchor="middle" font-size="11" fill="#0F172A">目录</text>
  <rect x="498" y="774" width="146" height="40" rx="8" fill="#FFFFFF" stroke="#185FA5" stroke-width="1"/>
  <text x="571" y="790" text-anchor="middle" font-size="11" fill="#0F172A">Alembic</text>
  <text x="571" y="807" text-anchor="middle" font-size="11" fill="#0F172A">迁移</text>

  <!-- Tier 10 Reuse -->
  <rect x="110" y="842" width="550" height="48" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
  <text x="122" y="866" font-size="11" font-weight="500" fill="#27500A">复用模块</text>
  <rect x="190" y="852" width="460" height="30" rx="8" fill="#FFFFFF" stroke="#3B6D11" stroke-width="1"/>
  <text x="420" y="871" text-anchor="middle" font-size="11" fill="#0F172A">knowledge/ · memory/ · tools/ · mcp_servers/ · utils/</text>

  <!-- Flow arrows -->
  <g stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="400" y1="106" y2="118"/>
    <line x1="400" y1="172" y2="184"/>
    <line x1="400" y1="264" y2="276"/>
    <line x1="400" y1="398" y2="410"/>
    <line x1="400" y1="468" y2="480"/>
    <line x1="400" y1="546" y2="558"/>
    <line x1="400" y1="680" y2="692"/>
    <line x1="400" y1="750" y2="762"/>
    <line x1="400" y1="828" y2="840"/>
  </g>

  <text x="110" y="912" font-size="11" fill="#475569">数据层（SQLite / data/ / Alembic）被服务层与 Agent Runtime 读写；外部依赖被 Agent Runtime、联网搜索与微信登录调用。</text>
</svg>
